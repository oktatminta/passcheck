<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Jelszóerősség Tesztelő</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 400px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        #result { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Jelszóerősség Ellenőrző</h2>
        <input type="password" id="password" placeholder="Írj be egy mintajelszót..." oninput="checkPassword()">
        <div id="result">Kezdj el gépelni...</div>
    </div>

    <script>
        function checkPassword() {
            let pwd = document.getElementById("password").value;
            let result = document.getElementById("result");
            let score = 0;

            if (pwd.length >= 8) score++;
            if (pwd.length >= 12) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            if (pwd.length === 0) {
                result.innerText = "Kezdj el gépelni...";
                result.style.color = "black";
            } else if (score <= 2) {
                result.innerText = "Gyenge jelszó ❌";
                result.style.color = "red";
            } else if (score <= 4) {
                result.innerText = "Közepes jelszó ⚠️";
                result.style.color = "orange";
            } else {
                result.innerText = "Erős jelszó ✅";
                result.style.color = "green";
            }
        }
    </script>
</body>
</html>
